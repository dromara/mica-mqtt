name: Java CI
permissions:
  contents: read
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '8', '21' ]
    name: Java ${{ matrix.java }} build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java }}
          cache: 'maven'
          cache-dependency-path: 'pom.xml'
      - name: Build with Maven
        # example 模块用的是 Spring Boot 4，最低要求 Java 17，Java 8 的 job 编译不了；
        # 把它从 reactor 里摘掉（-P !develop）跳过，其余模块两个 job 都编译，
        # 避免示例编译不过没人发现
        run: |
          if [ "${{ matrix.java }}" = "8" ]; then
            mvn clean package -U -P '!develop'
          else
            mvn clean package -U
          fi
      - name: Cluster integration tests
        # *IT 类不匹配 surefire 的默认 includes（默认只跑 *Test / Test* / *Tests / *TestCase），
        # 需要显式激活 profile 才会执行
        run: mvn -B -pl mica-mqtt-broker -am test -P cluster-integration
